repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github
        args: [--verify]
  - repo: local
    hooks:
      - id: selene
        name: Selene
        entry: selene
        language: system
        types: [lua]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^mcp/
      - id: ruff-format
        types_or: [python, pyi]
        files: ^mcp/
