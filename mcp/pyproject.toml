[project]
name = "fude-review-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "BLE", "PLW"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
